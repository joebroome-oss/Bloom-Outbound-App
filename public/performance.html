<!DOCTYPE html>
<html>
<head>

<title>Bloom Outbound — Performance</title>
<style>


:root {
  --bg:        #1a1a1a;
  --bg2:       #22252b;
  --cream:     #ebe8d9;
  --cream-75:  rgba(235, 232, 217, 0.75);
  --cream-55:  rgba(235, 232, 217, 0.55);
  --cream-40:  rgba(235, 232, 217, 0.40);
  --cream-12:  rgba(235, 232, 217, 0.12);
  --cream-08:  rgba(235, 232, 217, 0.06);
  --lime:      #94e073;
  --coral:     #f76938;
  --yellow:    #ffd62b;
  --lavender:  #c7adf0;
  --magenta:   #e32eed;
  --pad-s: 24px;
  --radius-s: 16px; --radius-m: 32px;
  --font-display: 'Riforma LL Medium', Inter, sans-serif;
  --font-body: 'Riforma LL Regular', Inter, -apple-system, sans-serif;
  --font-mono: 'Akkurat Mono LL Regular', 'Fragment Mono', monospace;
  --ease: cubic-bezier(0.4, 0, 0.2, 1);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--cream); font-family: var(--font-body); }
.stage { min-height: 100vh; padding: 40px 20px 60px; display: flex; flex-direction: column; align-items: center; }
.topbar { width: 100%; max-width: 640px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 28px; }
.logo { height: 22px; cursor: pointer; }
.back-pill {
  font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase;
  color: var(--cream-55); text-decoration: none; border: 1px solid var(--cream-12); border-radius: 999px;
  padding: 6px 14px; background: none; cursor: pointer;
}
.back-pill:hover { background: var(--cream-08); }
.wrap { width: 100%; max-width: 640px; }
h1 { font-family: var(--font-display); font-weight: 500; font-size: 26px; letter-spacing: -0.02em; margin: 0 0 6px; }
.subtitle { color: var(--cream-55); font-size: 13px; margin: 0 0 28px; font-family: var(--font-mono); letter-spacing: 0.02em; }
.subtitle b { color: var(--cream); font-family: var(--font-body); }
.stats { display: flex; gap: 10px; margin-bottom: 22px; }
.stat-box {
  background: linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
  border-radius: var(--radius-s); padding: var(--pad-s); flex: 1; text-align: center;
  border: 1px solid var(--cream-08);
  transition: border-color 120ms var(--ease), transform 120ms var(--ease);
}
.stat-box.clickable { cursor: pointer; }
.stat-box.clickable:hover { border-color: var(--cream-40); transform: translateY(-2px); }
.stat-num { font-family: var(--font-display); font-weight: 500; font-size: 32px; letter-spacing: -0.02em; }
.stat-label { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; color: var(--cream-40); letter-spacing: 0.04em; margin-top: 6px; }
.stat-hint { font-family: var(--font-mono); font-size: 9px; color: var(--cream-40); margin-top: 2px; opacity: 0; transition: opacity 120ms var(--ease); }
.stat-box.clickable:hover .stat-hint { opacity: 1; }
.stat-box.sent .stat-num { color: var(--lime); }
.stat-box.opened .stat-num { color: var(--yellow); }
.stat-box.replied .stat-num { color: var(--coral); }
.note {
  font-size: 13px; line-height: 1.6; color: var(--cream-75);
  background: var(--cream-08); border: 1px solid var(--cream-12);
  border-radius: var(--radius-s); padding: 18px 20px; margin-bottom: 12px; font-family: var(--font-body);
  white-space: pre-line;
}
.note b, .note-title { color: var(--cream); font-family: var(--font-display); font-weight: 500; }
.note-title { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; font-family: var(--font-mono); color: var(--lavender); margin-bottom: 10px; }
.note.insight .note-title { color: var(--lime); }
.note.improve .note-title { color: var(--coral); }
footer { text-align: center; font-size: 11px; color: var(--cream-40); margin-top: 24px; font-family: var(--font-mono); letter-spacing: 0.02em; }
@media (max-width: 480px) { .stats { flex-direction: column; } }

.biz-row {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 16px 18px; border-radius: var(--radius-s); background: var(--cream-08);
  border: 1px solid var(--cream-12); margin-bottom: 8px; cursor: pointer;
  transition: border-color 120ms var(--ease), transform 120ms var(--ease);
}
.biz-row:hover { border-color: var(--cream-40); transform: translateX(2px); }
.biz-main { display: flex; flex-direction: column; gap: 3px; }
.biz-company { font-family: var(--font-display); font-weight: 500; font-size: 16px; }
.biz-industry { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--cream-40); }
.biz-opened { font-family: var(--font-mono); font-size: 9px; text-transform: uppercase; letter-spacing: 0.03em; margin-top: 2px; }
.biz-opened.yes { color: var(--yellow); }
.biz-opened.no { color: var(--cream-40); }
.biz-opened.unknown { color: var(--cream-40); font-style: italic; }
.biz-meta { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
.biz-count { font-family: var(--font-display); font-weight: 500; font-size: 20px; color: var(--lime); }
.biz-date { font-family: var(--font-mono); font-size: 10px; color: var(--cream-40); }

.email-card {
  background: linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
  border-radius: var(--radius-m); padding: 28px; margin-bottom: 14px; border: 1px solid var(--cream-08);
}
.email-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.pill {
  display: inline-block; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.04em;
  text-transform: uppercase; padding: 6px 14px; border-radius: 10px; background: var(--cream-08);
  border: 1px solid rgba(199, 173, 240, 0.25); color: var(--lavender);
}
.pill.step0 { color: var(--lime); border-color: rgba(148,224,115,0.25); }
.pill.step1 { color: var(--yellow); border-color: rgba(255,214,43,0.25); }
.pill.step2 { color: var(--coral); border-color: rgba(247,105,56,0.25); }
.pill.step3 { color: var(--lavender); border-color: rgba(199,173,240,0.25); }
.pill.step4 { color: var(--magenta); border-color: rgba(227,46,237,0.25); }
.email-date { font-family: var(--font-mono); font-size: 11px; color: var(--cream-40); }
.email-subject { font-family: var(--font-display); font-weight: 500; font-size: 17px; margin: 0 0 10px; }
.email-body { font-size: 14px; line-height: 1.6; color: var(--cream-75); white-space: pre-wrap; margin: 0; }
.confirm-flag { font-family: var(--font-mono); font-size: 9px; color: var(--cream-40); margin-top: 12px; letter-spacing: 0.02em; }

.detail-head { margin-bottom: 22px; }
.detail-company { font-family: var(--font-display); font-weight: 500; font-size: 22px; margin: 0 0 4px; }
.detail-meta { font-family: var(--font-mono); font-size: 11px; color: var(--cream-55); text-transform: uppercase; letter-spacing: 0.03em; }

</style>
</head>

let view = 'dashboard';
let selectedCompany = null;

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function showDashboard() { view = 'dashboard'; render(); }
function showBusinesses() { view = 'businesses'; render(); }
function showDetail(company) { selectedCompany = company; view = 'detail'; render(); }

function fmtDate(iso) {
  if (!iso) return '';
  const d = new Date(iso + 'T00:00:00');
  return d.toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
}

function renderDashboard() {
  document.getElementById('backBtn').style.display = 'none';
  document.getElementById('heading').innerHTML = '<h1>Outbound performance</h1><p class="subtitle">As of <b>' + fmtDate(DATA.as_of) + '</b></p>';
  document.getElementById('content').innerHTML = `
    <div class="stats">
      <div class="stat-box sent clickable" onclick="showBusinesses()">
        <div class="stat-num">${DATA.sent}</div>
        <div class="stat-label">Sent</div>
        <div class="stat-hint">view by business ↗</div>
      </div>
      <div class="stat-box opened"><div class="stat-num">${DATA.open_rate_pct}%</div><div class="stat-label">Opened</div></div>
      <div class="stat-box replied"><div class="stat-num">${DATA.replied}</div><div class="stat-label">Replied</div></div>
    </div>
    <div class="note"><b>Opens —</b> ${esc(DATA.note_opens)}</div>
    <div class="note"><b>Replies —</b> ${esc(DATA.note_replies)}</div>
    <div class="note insight"><span class="note-title">Summary — what the data shows</span>${esc(DATA.summary_text)}</div>
    <div class="note improve"><span class="note-title">How we can improve</span>${esc(DATA.improve_text)}</div>
    <footer>Sent from HubSpot's logged Apollo emails · Opens from Apollo's own tracking · Replies from a direct Gmail scan</footer>
  `;
}

function renderBusinesses() {
  document.getElementById('backBtn').style.display = 'inline-block';
  document.getElementById('backBtn').onclick = showDashboard;
  document.getElementById('heading').innerHTML = '<h1>Sent, by business</h1><p class="subtitle">' + DATA.businesses.length + ' businesses · ' + DATA.sent + ' emails sent</p>';
  const rows = DATA.businesses.map(b => {
    let openedCls = 'unknown', openedTxt = 'opens: not checked';
    if (b.apollo_opened === true) { openedCls = 'yes'; openedTxt = 'opened ✓'; }
    else if (b.apollo_opened === false) { openedCls = 'no'; openedTxt = 'not opened yet'; }
    return `
    <div class="biz-row" onclick="showDetail('${esc(b.company).replace(/'/g,"\\'")}')">
      <div class="biz-main">
        <div class="biz-company">${esc(b.company)}</div>
        <div class="biz-industry">${esc(b.industry)}</div>
        <div class="biz-opened ${openedCls}">${openedTxt}</div>
      </div>
      <div class="biz-meta">
        <div class="biz-count">${b.sent_count}</div>
        <div class="biz-date">last ${fmtDate(b.last_sent)}</div>
      </div>
    </div>`;
  }).join('');
  document.getElementById('content').innerHTML = rows;
}

function renderDetail() {
  const b = DATA.businesses.find(x => x.company === selectedCompany);
  document.getElementById('backBtn').style.display = 'inline-block';
  document.getElementById('backBtn').onclick = showBusinesses;
  if (!b) { document.getElementById('content').innerHTML = '<p>Not found.</p>'; return; }
  document.getElementById('heading').innerHTML = `
    <div class="detail-head">
      <p class="detail-company">${esc(b.company)}</p>
      <p class="detail-meta">${esc(b.industry)} · ${esc(b.contact_name)}${b.title ? ', ' + esc(b.title) : ''}</p>
    </div>`;
  const cards = b.emails.map(e => `
    <div class="email-card">
      <div class="email-head">
        <span class="pill step${e.step}">${esc(e.label)}</span>
        <span class="email-date">${fmtDate(e.date_sent)}</span>
      </div>
      <p class="email-subject">${esc(e.subject)}</p>
      <p class="email-body">${esc(e.body)}</p>
      <div class="confirm-flag">confirmed via ${esc(e.confirmed_via)}${b.apollo_open_note ? ' · ' + esc(b.apollo_open_note) : ''}</div>
    </div>`).join('');
  document.getElementById('content').innerHTML = cards;
}

function render() {
  if (view === 'dashboard') renderDashboard();
  else if (view === 'businesses') renderBusinesses();
  else if (view === 'detail') renderDetail();
  window.scrollTo(0,0);
}

render();

</script>
</body>
</html>
